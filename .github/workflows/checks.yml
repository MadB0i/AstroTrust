name: Research instrument checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked --extra dev --python python
      - run: uv run --locked --extra dev python -m pytest
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev mypy astrotrust tests tools
      - run: uv run --locked --extra dev python -m astrotrust validate benchmark/scenarios
      - run: uv run --locked --extra dev python tools/export_schema.py --check
      - run: uv run --locked --extra dev python tools/check_review_example.py
      - run: uv run --locked --extra dev python tools/check_review_bundles.py
